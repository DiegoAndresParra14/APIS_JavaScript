<!DOCTYPE html>
<html lang="es">
<head>
	<meta charset="UTF-8">
	<meta http-equiv="X-UA-Compatible" content="IE=edge">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<link rel="preconnect" href="https://fonts.googleapis.com">
	<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
	<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@600&display=swap" rel="stylesheet">
	<link rel="stylesheet" href="famousTvShows.css">
	<title>Sitio de TvShows!
    </title>
</head>
<body>
    <form id="apiConfig">
      <label for="apiToken">Token de lectura de TMDB</label>
      <input id="apiToken" type="password" autocomplete="off" required>
      <button type="submit">Cargar catálogo</button>
    </form>
    <p id="estado" role="status" aria-live="polite">Introduce tu token para consultar el catálogo. No se guarda al cerrar la página.</p>
	<div class="contenedor" id="contenedor"></div>

	<div class="paginacion">
		<button id="btnAnterior">Anterior</button>
		<button id="btnSiguiente">Siguiente</button>
	</div>

	<script src="../catalog.js"></script>
	<script src="famousTvShows.js"></script>
</body>
</html>
